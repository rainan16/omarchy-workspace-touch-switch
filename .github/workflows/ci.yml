name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        c_compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build
        run: make CC=${{ matrix.c_compiler }}

      - name: Test
        run: |
          node test/gesture-model.js
          node test/gesture-flow.js

  qmllint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packages
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git qt6-declarative quickshell

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Omarchy shell
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          ref: quattro
          path: .ci/omarchy
          persist-credentials: false
          sparse-checkout: shell
          fetch-depth: 1

      - name: qmllint
        run: |
          mkdir -p .ci/qml/qs
          ln -s "$PWD/.ci/omarchy/shell/Commons" .ci/qml/qs/Commons
          ln -s "$PWD/.ci/omarchy/shell/Ui" .ci/qml/qs/Ui
          /usr/lib/qt6/bin/qmllint -I "$PWD/.ci/qml" Service.qml Overlay.qml
